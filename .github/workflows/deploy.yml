name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Repositories may trigger a rebuild after merging documentation:
  #   gh api repos/Luna-Flow/Luna-Flow.github.io/dispatches -f event_type=docs-updated
  repository_dispatch:
    types: [docs-updated]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - uses: typst-community/setup-typst@v5
      # The Ubuntu mirrors sometimes answer 503 for minutes; retry each
      # download and keep the .deb files in a cache that is renewed monthly.
      - name: Key for the apt cache
        id: apt-key
        run: echo "key=apt-${ImageOS:-unknown}-$(dpkg --print-architecture)-fonts-noto-cjk-graphviz-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
      - name: Install CJK fonts and Graphviz
        timeout-minutes: 15
        run: |
          archives="$HOME/.cache/apt-archives"
          mkdir -p "$archives/partial"
          apt_options=(-o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::Archives="$archives")
          sudo apt-get "${apt_options[@]}" update || echo "::warning::apt-get update failed; installing from the existing lists"
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends fonts-noto-cjk graphviz
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      - name: Fetch documentation sources
        env:
          GH_TOKEN: ${{ secrets.LUNAFLOW_DOCS_TOKEN != '' && secrets.LUNAFLOW_DOCS_TOKEN || github.token }}
        run: |
          mkdir -p ../workspace
          node tools/discover-repos.mjs ../workspace/repositories.json
          gh api repos/Luna-Flow/.github/contents/project-sync.json --jq .content | base64 --decode > ../workspace/project-sync.json
          for repo in $(node -p "require('../workspace/repositories.json').repositories.join(' ')"); do
            branch=$(node -p "require('./config/repos.json').branch")
            echo "Fetching $repo@$branch"
            mkdir -p "../workspace/$repo"
            gh api "repos/Luna-Flow/$repo/tarball/$branch" | tar -xz -C "../workspace/$repo" --strip-components=1 || { echo "::error::could not fetch $repo"; exit 1; }
          done
      - run: npm ci
      - name: Check site content
        run: node tools/lunadoc/cli.mjs check . --doc content
      - name: Build
        env:
          LUNAFLOW_REPO_ROOT: ../workspace
          LUNAFLOW_REPO_MANIFEST: ../workspace/repositories.json
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
