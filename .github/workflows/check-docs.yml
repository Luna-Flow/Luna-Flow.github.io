# Reusable documentation check for Luna-Flow repositories.
#
# A repository calls it from .github/workflows/docs.yml:
#
#   jobs:
#     docs:
#       uses: Luna-Flow/Luna-Flow.github.io/.github/workflows/check-docs.yml@main
#
# It fails when doc/ breaks the documentation standard, when the gettext
# catalogs are out of date, when a link is broken, or when a Typst or Graphviz
# attachment does not compile.

name: Check documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: repo
      - name: Check out lunadoc
        uses: actions/checkout@v7
        with:
          repository: Luna-Flow/Luna-Flow.github.io
          ref: main
          path: site
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install lunadoc
        run: npm ci --prefix site --workspace tools/lunadoc --include-workspace-root=false
      - uses: typst-community/setup-typst@v5
      # The Ubuntu mirrors sometimes answer 503 for minutes; retry each
      # download and keep the .deb files in a cache that is renewed monthly.
      - name: Key for the apt cache
        id: apt-key
        run: echo "key=apt-${ImageOS:-unknown}-$(dpkg --print-architecture)-fonts-noto-cjk-graphviz-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
      - name: Install CJK fonts and Graphviz
        timeout-minutes: 15
        run: |
          archives="$HOME/.cache/apt-archives"
          mkdir -p "$archives/partial"
          apt_options=(-o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::Archives="$archives")
          sudo apt-get "${apt_options[@]}" update || echo "::warning::apt-get update failed; installing from the existing lists"
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends fonts-noto-cjk graphviz
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      - name: Translation status
        run: node site/tools/lunadoc/cli.mjs status repo
      - name: Check
        run: node site/tools/lunadoc/cli.mjs check repo --compile
